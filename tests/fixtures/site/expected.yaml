# Expected results for the fixture site, worked out by hand (see README.md).
# Used by `pathcrawl selftest` and tests/test_graph.py. Pages are named by file
# stem ("entry-far" = entry-far.html). null means "none / never".

max_depth: 8
crawled_pages: 9   # the win is recorded but never loaded
entries:
  near: entry-near
  far: entry-far

modes:
  all_links:
    reachable_pages: 10
    shortest_path:
      near: [entry-near, win]
      far: [entry-far, win]
    longest_path:
      near: [entry-near, about, win]
      far: [entry-far, article-1, trap-a, trap-b, trap-c, about, win]
    worst_case_max_clicks: 1
    distance_distribution: {0: 1, 1: 8}
    dead_ends: [orphan]
    dead_end_pct: 11.1
    trap_loops: []
    dead_zone_click:
      near: 1
      far: null
    converged: true
    overlap_jaccard: 0.333

  content_only:
    reachable_pages: 9
    shortest_path:
      near: [entry-near, win]
      far: [entry-far, article-1, article-2, win]
    longest_path:
      near: [entry-near, win]
      far: [entry-far, article-1, article-2, win]
    worst_case_max_clicks: 3
    distance_distribution: {0: 1, 1: 2, 2: 1, 3: 1}
    dead_ends: [orphan, trap-a, trap-b, trap-c]
    dead_end_pct: 44.4
    trap_loops: [[trap-a, trap-b, trap-c]]
    dead_zone_click:
      near: 1
      far: 2
    converged: true
    overlap_jaccard: 0.2

# Where each page stands with content links only (categories.csv, reach_content_only).
categories_content_only:
  win: win
  entry-near: reaches win
  entry-far: reaches win
  article-1: reaches win
  article-2: reaches win
  about: not reached
  orphan: dead end
  trap-a: trap loop
  trap-b: trap loop
  trap-c: trap loop
