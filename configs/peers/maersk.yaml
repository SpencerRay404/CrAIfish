# Peer comparison: Maersk. Public pages only: no login, no form submits,
# robots.txt honoured. Crawl with:
#   pathcrawl crawl --config configs/peers/maersk.yaml --campaign peer-compare --non-interactive
# Wildcard group blocks dashboards and portals, careers, internal support, tracking, search and filter pages,
# .doc/.ppt/.xls files and URLs with tracking parameters. Sitemaps: sitemap.xml, sitemap-cs.xml, sitemap-is.xml.
#
# Win URLs came from planning searches and were not all opened as pages. At
# the end of the crawl each linked win URL is checked (report: "Win URLs");
# anything that fails is reported, not dropped. Verify the start URL at run time.

client:
  name: "Maersk"
  slug: "maersk"

scope:
  allowed_domains: ["www.maersk.com"]
  include_patterns: ["^https://www\\.maersk\\.com/"]
  strip_query_params: ["msockid", "_gl", "gclid", "gbraid", "wbraid", "gad_source", "gad_campaignid", "gclsrc", "mkt_tok", "fbclid", "utm_*", "campaign_id", "WT.*"]
  capture_params: []

win:
  name: "any win"
  classes:
    - name: quote_request   # includes /onlinequote/standard; the FAQ says a person replies by email
      patterns:
        - "^https://www\\.maersk\\.com/onlinequote/"
    - name: to_verify   # support, probably not a sales win
      any_win: false
      patterns:
        - "^https://www\\.maersk\\.com/support/chat/"
        - "^https://www\\.maersk\\.com/support/case-management/"

campaigns:
  - id: "peer-compare"
    name: "Maersk peer comparison"
    platform: "site"
    ad_copy: "No ad: a structure and content crawl from the locale home page."
    entry_links:
      - label: "Maersk home"
        url: "https://www.maersk.com/"

health:
  home_url: "https://www.maersk.com/"

crawl:
  # Same settings for every site in the comparison (UPS included).
  max_depth: 50          # depth is measured, not capped; the page budget is the safety stop
  max_pages: 5000
  delay_ms: 1000         # one request per second at most
  backoff_s: 30          # on 403/429: wait 30 s, then 60 s, before giving up on a page
  backoff_retries: 2
  host_block_limit: 5    # 5 refused pages in a row: stop the host, report it as blocked
  headed: true
  slow_mo_ms: 0
  respect_robots: true
  page_timeout_ms: 30000
  screenshot: false
