# Peer comparison: DHL. Public pages only: no login, no form submits,
# robots.txt honoured. Crawl with:
#   pathcrawl crawl --config configs/peers/dhl.yaml --campaign peer-compare --non-interactive
# robots.txt disallows /content/, forms, tracking and express account paths; no region block on /us-en/.
#
# Win URLs came from planning searches and were not all opened as pages. At
# the end of the crawl each linked win URL is checked (report: "Win URLs");
# anything that fails is reported, not dropped. Verify the start URL at run time.

client:
  name: "DHL"
  slug: "dhl"

scope:
  allowed_domains: ["www.dhl.com"]
  include_patterns: ["^https://www\\.dhl\\.com/us-en/"]
  strip_query_params: ["msockid", "_gl", "gclid", "gbraid", "wbraid", "gad_source", "gad_campaignid", "gclsrc", "mkt_tok", "fbclid", "utm_*", "campaign_id", "WT.*"]
  capture_params: []

win:
  name: "any win"
  classes:
    - name: talk_to_sales
      patterns:
        - "^https://www\\.dhl\\.com/us-en/home/dhl-for-your-business/contact-our-small-and-medium-business-shipping-and-logistics-experts\\.html"
        - "^https://www\\.dhl\\.com/us-en/home/ecommerce/business-help-center/contact-dhl-ecommerce-sales-and-business-support\\.html"
    - name: lead_onboarding
      patterns:
        - "^https://www\\.dhl\\.com/us-en/home/request-a-business-account\\.html"
    - name: quote_request
      patterns:
        - "^https://www\\.dhl\\.com/us-en/home/get-a-quote\\.html"
        - "^https://www\\.dhl\\.com/global-en/microsites/supply-chain/fulfillment-network/get-a-quote\\.html"   # outside /us-en/: destination only
    - name: self_serve
      any_win: false
      patterns:
        - "^https://www\\.dhl\\.com/us-en/home/dhl-for-your-business/request-a-quote-page\\.html"   # information plus an embedded spot-quote tool

campaigns:
  - id: "peer-compare"
    name: "DHL peer comparison"
    platform: "site"
    ad_copy: "No ad: a structure and content crawl from the locale home page."
    entry_links:
      - label: "DHL home"
        url: "https://www.dhl.com/us-en/home.html"

health:
  home_url: "https://www.dhl.com/us-en/home.html"

crawl:
  # Same settings for every site in the comparison (UPS included).
  max_depth: 50          # depth is measured, not capped; the page budget is the safety stop
  max_pages: 5000
  delay_ms: 1000         # one request per second at most
  backoff_s: 30          # on 403/429: wait 30 s, then 60 s, before giving up on a page
  backoff_retries: 2
  host_block_limit: 5    # 5 refused pages in a row: stop the host, report it as blocked
  headed: true
  slow_mo_ms: 0
  respect_robots: true
  page_timeout_ms: 30000
  screenshot: false
