# Peer comparison: Flexport. Public pages only: no login, no form submits,
# robots.txt honoured. Crawl with:
#   pathcrawl crawl --config configs/peers/flexport.yaml --campaign peer-compare --non-interactive
# Permissive robots.txt: names GPTBot, OAI-SearchBot, ClaudeBot, Claude-Web, anthropic-ai, PerplexityBot,
# Google-Extended, CCBot, Bytespider, Amazonbot, Applebot-Extended, all allowed. Disallows /cdn-cgi/, /api/, /fragments/.
#
# Win URLs came from planning searches and were not all opened as pages. At
# the end of the crawl each linked win URL is checked (report: "Win URLs");
# anything that fails is reported, not dropped. Verify the start URL at run time.

client:
  name: "Flexport"
  slug: "flexport"

scope:
  allowed_domains: ["www.flexport.com"]
  include_patterns: ["^https://www\\.flexport\\.com/"]
  strip_query_params: ["msockid", "_gl", "gclid", "gbraid", "wbraid", "gad_source", "gad_campaignid", "gclsrc", "mkt_tok", "fbclid", "utm_*", "campaign_id", "WT.*"]
  capture_params: []

win:
  name: "any win"
  classes:
    - name: lead_onboarding
      patterns:
        - "^https://www\\.flexport\\.com/get-started/"
    - name: self_serve
      any_win: false
      patterns:
        - "^https://www\\.flexport\\.com/rates/"
    - name: to_verify   # title says custom quote; read as a demo video with no form. Classify after inspection.
      any_win: false
      patterns:
        - "^https://www\\.flexport\\.com/logistics/rtq-custom-quote/"

campaigns:
  - id: "peer-compare"
    name: "Flexport peer comparison"
    platform: "site"
    ad_copy: "No ad: a structure and content crawl from the locale home page."
    entry_links:
      - label: "Flexport home"
        url: "https://www.flexport.com/"

health:
  home_url: "https://www.flexport.com/"

crawl:
  # Same settings for every site in the comparison (UPS included).
  max_depth: 50          # depth is measured, not capped; the page budget is the safety stop
  max_pages: 5000
  delay_ms: 1000         # one request per second at most
  backoff_s: 30          # on 403/429: wait 30 s, then 60 s, before giving up on a page
  backoff_retries: 2
  host_block_limit: 5    # 5 refused pages in a row: stop the host, report it as blocked
  headed: true
  slow_mo_ms: 0
  respect_robots: true
  page_timeout_ms: 30000
  screenshot: false
