# Shared topic taxonomy for the peer comparison (UPS, FedEx, DHL, Flexport,
# Maersk). One rule set for every site, frozen before any peer is tagged:
# do not tune it per site. Change it only between comparison rounds, bump
# `version`, and re-tag every site.
#
# Pages are tagged from their title, H1, breadcrumb, menu label (how the
# site's own navigation names the page) and URL path, never the body text.
# The first field that matches is recorded with the term that fired.
#
# Starting point: the UPS topic rules from the site explorer's topic map are
# not in this repo. Merge them in here before the first peer is tagged, then
# freeze. Terms: case-insensitive whole words; a trailing * matches any
# ending; "re:" starts a regex.
version: "2026-10-04-frozen"  # NOT frozen: freeze only after review
types: [Topic]
entities:
  - {type: Topic, name: Ocean freight, terms: ["ocean freight", "ocean shipping", "sea freight", "ocean", "container shipping", "FCL", "LCL", "full container load", "less than container load"]}
  - {type: Topic, name: Air freight, terms: ["air freight", "air cargo", "airfreight", "air shipping"]}
