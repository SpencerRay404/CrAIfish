[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "craifish"
version = "0.1.0"
description = "Campaign path crawler: measures how reachable a conversion goal is from known marketing entry links."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.44",
    "beautifulsoup4>=4.12",
    "networkx>=3.2",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
pathcrawl = "pathcrawl.cli:app"

[tool.setuptools.packages.find]
include = ["pathcrawl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: needs Chromium (skipped locally if unavailable; required in CI)"]
