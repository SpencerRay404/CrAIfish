name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -v
      - name: Selftest gate (fixture site, expected vs actual)
        run: pathcrawl selftest
      - name: Shipped configs validate
        run: |
          pathcrawl validate --config configs/example.yaml
          pathcrawl validate --config configs/ups.yaml
